<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Plataforma de Psicólogos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Fonte Inter + Bootstrap -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
    {% if error %}
    <script>
        alert("{{ error }}");
    </script>
    {% endif %}
</head>

<body>
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="register-box">
        <h2 class="mb-4 text-center">Criar Conta</h2>

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Nome completo</label>
                <input type="text" class="form-control" name="name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" name="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">CRP</label>
                <input type="text" class="form-control" name="crp" required>
            </div>
            <div class="mb-3">
                <label for="cpf" class="form-label">CPF</label>
                <input type="text" class="form-control" id="cpf" name="cpf" required>
            </div>
            <div class="mb-3">
                <label class="form-label">WhatsApp (com DDD)</label>
                <input type="text" class="form-control" name="whatsapp" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" name="senha" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3">Cadastrar</button>
        </form>

        <p class="text-center text-muted mt-3">
            Já tem uma conta? <a href="{{ url_for('auth.login') }}">Entrar</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.8/dist/inputmask.min.js"></script>
<script>
    Inputmask({"mask": "999.999.999-99"}).mask("#cpf");
    Inputmask({"mask": "(99) 99999-9999"}).mask("input[name='whatsapp']");
</script>

</body>
</html>
