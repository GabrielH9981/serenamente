<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Ativar Conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h3 class="mb-4 text-center">Ativação da Conta</h3>

                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label for="codigo" class="form-label">Digite o código de ativação</label>
                        <input type="text" class="form-control" id="codigo" name="codigo" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Ativar Conta</button>
                </form>

                <div class="mt-3 text-center">
                    <a href="/">Voltar à página inicial</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
