<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Alterar e-mail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="login-box" style="max-width: 500px; width:100%;">
        <h2 class="mb-4 text-center">Alterar e-mail</h2>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <p class="text-muted mb-3 text-center">
            Informe o novo e-mail para sua conta.
        </p>

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Novo e-mail</label>
                <input type="email" class="form-control" name="email"
                       value="{{ email or '' }}" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2">
                Salvar e continuar
            </button>
        </form>

        <p class="text-center mt-3">
            <a href="{{ url_for('auth.verificar_email') }}">Voltar para verificação</a>
        </p>
    </div>
</div>
</body>
</html>
